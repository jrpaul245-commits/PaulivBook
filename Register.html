<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaulivBook — Register</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="Registerfirebase.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #9be7ff, #d8f7e3);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
      overflow: hidden;
      animation: pop .4s ease;
    }

    header {
      background: linear-gradient(135deg, #2bb673, #7ed957);
      padding: 26px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 800;
    }

    header p { font-size: .95rem; opacity: .95; }

    .content { padding: 22px; }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input, textarea {
      padding: 13px 15px;
      border-radius: 16px;
      border: 2px solid #e2f2ea;
      background: #f9fffc;
      font-size: 1rem;
      font-family: inherit;
      width: 100%;
    }

    @media (max-width: 480px) {
      input, textarea { font-size: 16px; }
    }

    textarea { resize: none; height: 90px; }

    button {
      padding: 14px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #4a3b00;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
      width: 100%;
      font-family: inherit;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,.25); }
    button:active { transform: translateY(0); }

    .link {
      text-align: center;
      margin-top: 10px;
      font-size: .85rem;
    }

    .link span {
      color: #2bb673;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1>Pauliv Book</h1>
    <p>CREATE ACCOUNT</p>
  </header>
  <div class="content">
    <div id="registerView">
      <form id="registerForm">
        <input type="text" id="username" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <textarea id="regSkills" placeholder="Your skills (e.g. Design, Coding)"></textarea>
        <textarea id="regExperience" placeholder="Experience summary"></textarea>
        <button type="button" id="submit">Create Profile</button>
      </form>
      <div class="link">
        Already have account? <span onclick="Login()">Login</span>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>

</html>
