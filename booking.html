<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaulivBook</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #9be7ff, #d8f7e3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
      overflow: hidden;
      animation: pop .4s ease;
    }

    header {
      background: linear-gradient(135deg, #2bb673, #7ed957);
      padding: 26px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
    }

    header p {
      font-size: .95rem;
      opacity: .95;
    }

    .content {
      padding: 22px;
    }

    .hidden { display: none; }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input, textarea {
      padding: 13px 15px;
      border-radius: 16px;
      border: 2px solid #e2f2ea;
      background: #f9fffc;
      font-size: .95rem;
      font-family: inherit;
    }

    textarea {
      resize: none;
      height: 90px;
    }

    button {
      padding: 14px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #4a3b00;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }

    .link {
      text-align: center;
      margin-top: 10px;
      font-size: .85rem;
    }

    .link span {
      color: #2bb673;
      font-weight: 700;
      cursor: pointer;
    }

    .profile {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile h2 {
      text-align: center;
      color: #2bb673;
      font-size: 1.3rem;
    }

    .card {
      background: #f0fff7;
      padding: 14px;
      border-radius: 16px;
      border-left: 6px solid #7ed957;
      font-size: .9rem;
    }

    .logout {
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      color: #fff;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1>Pauliv Book</h1>
    <p>WELCOME!</p>
  </header>

  <div class="content">

    <!-- LOGIN -->
    <div id="loginView">
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>
      <div class="link">
        New here? <span onclick="showRegister()">Register!</span>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="registerView" class="hidden">
      <form id="registerForm">
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <textarea id="regSkills" placeholder="Your skills (e.g. Design, Coding)"></textarea>
        <textarea id="regExperience" placeholder="Experience summary"></textarea>
        <button type="submit">Create Profile</button>
      </form>
      <div class="link">
        Already have account? <span onclick="showLogin()">Login</span>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="profileView" class="hidden">
      <div class="profile">
        <h2>Citizen Profile</h2>
        <div class="card"><strong>Name:</strong> <span id="pName"></span></div>
        <div class="card"><strong>Email:</strong> <span id="pEmail"></span></div>
        <div class="card"><strong>Skills:</strong><br><span id="pSkills"></span></div>
        <div class="card"><strong>Experience:</strong><br><span id="pExperience"></span></div>
        <button class="logout" onclick="logout()">Logout</button>
      </div>
    </div>

  </div>
</div>

</body>
</html>
